@if (signOutVisible()) {
  <div class="dialog-backdrop" role="presentation" (click)="!busy() && cancelSignOut.emit()">
    <section class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="signout-dialog-title" (click)="$event.stopPropagation()">
      <button class="dialog-close" type="button" [disabled]="busy()" (click)="cancelSignOut.emit()" [attr.aria-label]="language.t('dashboard.close')">
        <app-icon name="close" [size]="18" />
      </button>
      <span class="dialog-icon"><app-icon name="log-out" [size]="20" /></span>
      <p class="eyebrow">{{ userEmail() }}</p>
      <h2 id="signout-dialog-title">{{ language.t('nav.logoutConfirmTitle') }}</h2>
      <p class="dialog-body">{{ language.t('nav.logoutConfirmBody') }}</p>
      <div class="dialog-actions">
        <button class="dialog-btn dialog-btn-secondary" type="button" [disabled]="busy()" (click)="cancelSignOut.emit()">
          {{ language.t('nav.logoutCancel') }}
        </button>
        <button class="dialog-btn dialog-btn-primary" type="button" [disabled]="busy()" (click)="confirmSignOut.emit()">
          {{ busy() ? language.t('auth.wait') : language.t('nav.logoutConfirmAction') }}
        </button>
      </div>
    </section>
  </div>
}

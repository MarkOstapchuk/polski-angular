<main class="feedback-page">
  <header class="page-topbar">
    <a class="brand" routerLink="/" [attr.aria-label]="language.t('auth.brand')"><span class="brand-mark">p</span><span>polski<span class="brand-dot">.</span></span></a>
    <app-language-switcher />
  </header>
  <a class="back-link" [routerLink]="backUrl()">← {{ language.t('feedback.back') }}</a>

  <section class="feedback-card">
    <p class="eyebrow">{{ language.t('feedback.eyebrow') }}</p>
    <h1>{{ language.t('feedback.title') }}</h1>
    <p class="intro">{{ language.t('feedback.intro') }}</p>

    @if (sent()) { <p class="form-message success-message" role="status">{{ language.t('feedback.sent') }}</p> }
    @if (error()) { <p class="form-message error-message" role="alert">{{ error() }}</p> }

    <form (ngSubmit)="submit()">
      <label>{{ language.t('feedback.topic') }}
        <select name="category" [ngModel]="category()" (ngModelChange)="category.set($event)">
          <option value="app">{{ language.t('feedback.app') }}</option>
          <option value="course">{{ language.t('feedback.course') }}</option>
        </select>
      </label>

      @if (category() === 'course') {
        <label>{{ language.t('feedback.chooseCourse') }}
          <select name="course" [ngModel]="courseId()" (ngModelChange)="courseId.set($event)">
            @for (course of courses; track course.id) {
              <option [value]="course.id">{{ course.name }} · {{ course.level }}</option>
            }
          </select>
        </label>
      }

      <label>{{ language.t('feedback.yourFeedback') }}
        <textarea name="message" [ngModel]="message()" (ngModelChange)="message.set($event)" required minlength="1" maxlength="2000" rows="6" [placeholder]="language.t('feedback.placeholder')"></textarea>
        <span class="char-counter" aria-live="polite">{{ message().length }} / 2000 {{ language.t('feedback.characters') }}</span>
      </label>
      <button class="submit-button" type="submit" [disabled]="sending() || !message().trim()">{{ sending() ? language.t('feedback.sending') : language.t('feedback.send') }}</button>
    </form>
  </section>
</main>

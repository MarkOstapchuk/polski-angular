<main class="feedback-page">
  <a class="brand" routerLink="/" aria-label="Polski, strona główna"><span class="brand-mark">p</span><span>polski<span class="brand-dot">.</span></span></a>
  <a class="back-link" routerLink="/">← Wróć do nauki</a>

  <section class="feedback-card">
    <p class="eyebrow">TWOJA OPINIA MA ZNACZENIE</p>
    <h1>Обратная связь</h1>
    <p class="intro">Расскажите, что можно улучшить в приложении или курсе.</p>

    @if (sent) { <p class="form-message success-message" role="status">Спасибо! Ваш отзыв отправлен.</p> }
    @if (error) { <p class="form-message error-message" role="alert">{{ error }}</p> }

    <form (ngSubmit)="submit()">
      <label>О чём отзыв?
        <select name="category" [(ngModel)]="category">
          <option value="app">О приложении</option>
          <option value="course">О курсе</option>
        </select>
      </label>

      @if (category === 'course') {
        <label>Курс
          <select name="course" [(ngModel)]="courseId">
            @for (course of courses; track course.id) {
              <option [value]="course.id">{{ course.name }} · {{ course.level }}</option>
            }
          </select>
        </label>
      }

      <label>Ваш отзыв
        <textarea name="message" [(ngModel)]="message" required minlength="1" maxlength="2000" rows="6" placeholder="Что понравилось или что стоит исправить?"></textarea>
      </label>
      <button class="submit-button" type="submit" [disabled]="sending || !message.trim()">{{ sending ? 'Отправка…' : 'Отправить отзыв' }}</button>
    </form>
  </section>
</main>

<div class="option-list" role="group" [attr.aria-label]="prompt()">
  @for (option of options(); track option.value; let idx = $index) {
    <button class="option-button" type="button"
      [attr.data-hotkey]="showHotkeyBadges() && options().length <= 9 && !checked() ? idx + 1 : null"
      [class.selected]="value() === option.value"
      [class.option-right]="checked() && optionIsAccepted(option.value)"
      [class.option-error]="checked() && value() === option.value && !isCorrect()"
      [disabled]="checked()"
      (click)="select(option.value)">{{ option.label }}</button>
  }
</div>
